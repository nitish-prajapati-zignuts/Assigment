name: Feature Request
description: Propose a new feature or enhancement for the application
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new feature? Share it with us!
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: A clear and concise description of what the feature is and why it's needed.
      placeholder: Describe the feature you want to add...
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case / Problem Solved
      description: Explain the problem this feature solves and the user value it adds.
      placeholder: Why is this important to you or other users?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution / Implementation Idea
      description: Outline any ideas you have on how to implement this feature (Frontend/Backend details).
      placeholder: How should this be built?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: A clear and concise description of any alternative solutions or features you've considered.
