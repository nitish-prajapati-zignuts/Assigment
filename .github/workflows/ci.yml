name: Continuous Integration

on:
  push:
    branches-ignore:
      - main # Main branch runs the Release workflow
  pull_request:
    branches:
      - main

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Sub-Project Dependencies
        run: npm run install:all

      - name: Check Code Formatting (Prettier)
        run: npm run format:check

      - name: Lint Codebases
        run: npm run lint

  type-check:
    name: TypeScript Compilation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Sub-Project Dependencies
        run: npm run install:all

      - name: Backend Type Check
        run: npm run type-check --prefix Backend

      - name: Frontend Type Check
        run: npm run type-check --prefix Frontend

  build-verification:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-format, type-check]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Sub-Project Dependencies
        run: npm run install:all

      - name: Build Application Modules
        run: npm run build
