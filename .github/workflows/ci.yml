name: Continuous Integration

on:
  push:
    branches-ignore:
      - main # Main branch runs the Release workflow
  pull_request:
    branches:
      - main

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Sub-Project Dependencies
        run: npm run install:all

      - name: Check Code Formatting (Prettier)
        run: npm run format:check

      - name: Lint Codebases
        run: npm run lint

  type-check:
    name: TypeScript Compilation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Sub-Project Dependencies
        run: npm run install:all

      - name: Backend Type Check
        run: npm run type-check --prefix Backend

      - name: Frontend Type Check
        run: npm run type-check --prefix Frontend

  build-verification:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-format, type-check]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Sub-Project Dependencies
        run: npm run install:all

      - name: Build Application Modules
        run: npm run build

  cypress-tests:
    name: Cypress End-to-End Tests
    runs-on: ubuntu-latest
    needs: [type-check]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: neondb
          POSTGRES_USER: neondb_owner
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Sub-Project Dependencies
        run: npm run install:all

      - name: Push Database Schema
        run: npm run db:push --prefix Backend
        env:
          DATABASE_URL: postgresql://neondb_owner:password@localhost:5432/neondb

      - name: Start Services
        run: |
          npm run dev &
          npx wait-on http://localhost:3000 http://localhost:4000/health
        env:
          DATABASE_URL: postgresql://neondb_owner:password@localhost:5432/neondb
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'meeting_key_Ab8RN6K3RKtaqTY44PZgdDdx' }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}

      - name: Run Cypress Tests
        run: npm run cy:run --prefix Frontend

