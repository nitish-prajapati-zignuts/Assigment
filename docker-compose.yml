version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: meeting_notes_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
      POSTGRES_DB: meeting_notes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: meeting_notes_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres_secure_password@db:5432/meeting_notes?sslmode=disable
      JWT_SECRET: default_docker_jwt_secret_key_12345
      GEMINI_API_KEYS: ""
      GOOGLE_GENERATIVE_AI_API_KEY: ""
      ENABLE_RATE_LIMITER: "false"
      NODE_ENV: development
    depends_on:
      - db

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: meeting_notes_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    depends_on:
      - backend

volumes:
  pgdata:
